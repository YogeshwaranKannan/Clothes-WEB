<section class="hero-carousel" (mouseenter)="onMouseEnter()" (mouseleave)="onMouseLeave()">
  <div class="slides">
    <ng-container *ngFor="let b of banners; let i = index">
      <article class="slide"
        [attr.data-state]="i === active ? 'active' : (i === prevActive ? 'from-active' : 'inactive')"
        [attr.data-dir]="direction">

        <!-- Responsive hero image:
             - mobile-image (500×350px) served on screens ≤768px
             - desktop-image (1800×360px) served on screens >768px
             First slide loads eagerly to avoid flash; rest are lazy. -->
        <picture>
          <source media="(max-width: 768px)" [srcset]="b.mobileImage">
          <img
            class="hero-img"
            [src]="b.desktopImage"
            [loading]="i === 0 ? 'eager' : 'lazy'"
            alt="Hero banner"
          />
        </picture>

        <!-- Overlay content -->
        <div class="hero-overlay">
          <div class="hero-content">
            <!-- <div *ngIf="b.subtitle" class="badge">{{ b.subtitle }}</div> -->
            <h1 class="title">{{ b.title }}</h1>
            <!-- <p class="desc">{{ b.description }}</p> -->
            <div class="ctas">
              <!-- <button class="btn primary" (click)="goToPhone(b.id)">Shop Now</button> -->
              <!-- <button class="btn ghost" (click)="goToCategory(b.category)">View Category</button> -->
            </div>
          </div>
        </div>

      </article>
    </ng-container>
  </div>

  <button class="arrow prev" [attr.aria-label]="'Previous'" (click)="prev()">‹</button>
  <button class="arrow next" [attr.aria-label]="'Next'" (click)="next()">›</button>

  <div class="dots" *ngIf="banners.length > 1">
    <button
      *ngFor="let _ of banners; let i = index"
      class="dot"
      [class.active]="i === active"
      (click)="go(i)"
      [attr.aria-label]="'Go to slide ' + (i + 1)">
    </button>
  </div>
</section>
