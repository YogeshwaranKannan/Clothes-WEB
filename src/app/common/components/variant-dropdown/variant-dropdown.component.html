<div class="variant-dropdown" (click)="$event.stopPropagation()">

  <button
    type="button"
    class="variant-trigger"
    (click)="openVariant($event)"
    aria-haspopup="dialog"
  >
    <span class="variant-trigger__label">
      {{ getSelectedVariant()?.variantsName ?? 'Select size / weight' }}
    </span>
    <svg class="variant-trigger__chevron" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

</div>
