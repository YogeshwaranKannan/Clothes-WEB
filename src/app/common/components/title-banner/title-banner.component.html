<ng-container *ngIf="pageTitle && leftTitle !== 'Home'">
  <div class="title-banner" role="banner" aria-label="Page title banner">
    <div class="title-banner__inner container">

      <!-- LEFT : Page title -->
      <div class="title-banner__left">
        <div class="page-title capitalize-first-letter">
          {{ leftTitle }}
        </div>
      </div>
 

    </div>
  </div>
</ng-container>
