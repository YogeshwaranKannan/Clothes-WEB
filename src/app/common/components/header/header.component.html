 <header class="pc-header" #host>

  <!-- ══════════════════════════════════════════════════════════════════════
       SINGLE TOPBAR — left: menu · centre: logo (+ search when open) · right: actions
       Desktop: search opens to the right of the logo; everything else stays visible.
       Mobile : search takes the full row (see .search-open rules in SCSS).
  ═══════════════════════════════════════════════════════════════════════ -->
  <div class="pc-header__topbar" [class.search-open]="searchOpen">

    <!-- LEFT: small fixed area for hamburger/menu -->
    <div class="topbar-left">
      <div class="mobile-menu-row">

        <!-- Logged in: first-letter avatar (mobile only) -->
        <button
          *ngIf="isLoggedIn(); else hamburgerBtn"
          type="button"
          class="mobile-avatar-btn"
          [class.is-open]="isMobileMenuOpen"
          [attr.aria-label]="isMobileMenuOpen ? 'Close navigation menu' : 'Open account menu'"
          [attr.aria-expanded]="isMobileMenuOpen"
          aria-controls="mobileSidebar"
          (click)="toggleMobileMenu()">
          {{ userInitial }}
        </button>

        <!-- Logged out: original hamburger -->
        <ng-template #hamburgerBtn>
          <button
            type="button"
            class="mobile-menu-btn"
            [class.is-open]="isMobileMenuOpen"
            [attr.aria-label]="isMobileMenuOpen ? 'Close navigation menu' : 'Open navigation menu'"
            [attr.aria-expanded]="isMobileMenuOpen"
            aria-controls="mobileSidebar"
            (click)="toggleMobileMenu()">
            <span class="hamburger-box">
              <span class="hamburger-bar hamburger-bar--top"></span>
              <span class="hamburger-bar hamburger-bar--mid"></span>
              <span class="hamburger-bar hamburger-bar--bottom"></span>
            </span>
          </button>
        </ng-template>

      </div>
    </div>

    <!-- CENTER: logo + search (search sits to the right of the logo) -->
    <div class="topbar-center">
      <div class="logo-search-group">

        <a class="header-logo" routerLink="/" aria-label="Purest home" (click)="onLogoClick()">
          <span class="header-logo-wrap">
            <img
              class="header-logo-img"
              src="assets/img/logo/dolphin_Updated.jpg"
              alt="Purest — Wood-Cold Pressed Oil"
              loading="eager"
              draggable="false"
            />
          </span>
        </a>

        <!-- Search Mode (shown when searchOpen) -->
        <div *ngIf="searchOpen" class="header-search-container">
          <app-product-suggest
            mode="product"
            [navigateOnSelect]="true"
            (productSelected)="closeSearch()">
          </app-product-suggest>
          <button type="button" class="close-search-btn" (click)="closeSearch()" aria-label="Close search">✕</button>
        </div>

      </div>
    </div>

    <!-- ── RIGHT: Track · Search · Cart · User ──────────────── -->
    <div class="topbar-right">
      <div id="headerSummary" class="actions">

        <!-- Track My Order — migrated to <app-navbar>, see navbar.component.html -->

        <!-- Wishlist -->
        <!-- <button type="button" class="icon-btn wishlist-icon"
                aria-label="Wishlist" (click)="goToWishlist()">
          <ng-container *ngIf="wishlistCount$ | async as wc">
            <span class="heart" [class.active]="wc > 0">{{ wc > 0 ? '♥' : '♡' }}</span>
            <span class="wish-badge" *ngIf="wc > 0">{{ wc }}</span>
          </ng-container>
        </button> -->

        <div class="track-order desktop-track-order" #trackOrderContainer>

          <!-- Collapsed: icon + label -->
          <button
            *ngIf="!showTrackInput"
            type="button"
            class="track-link icon-btn"
            title="Track My Order"
            (click)="toggleTrackInput()">

            <!-- Bike -->
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="5" cy="17" r="3"/>
              <circle cx="19" cy="17" r="3"/>
              <path d="M12 17H5.5"/>
              <path d="M19 17h-2l-3-6h-4l-1 3"/>
              <path d="M14 11l2-4h3"/>
            </svg>

            <span class="track-label">Track Order</span>
          </button>

          <!-- Expanded: input + Search + Close -->
          <div *ngIf="showTrackInput" class="track-input-wrap">
            <input
              #trackInputEl
              type="text"
              [(ngModel)]="refNo"
              placeholder="Enter Order / Ref No"
              class="track-input"
              aria-label="Order reference number"
              (keyup.enter)="trackOrder()" />

            <button type="button" class="track-search-btn" (click)="trackOrder()">
              Search
            </button>

            <button
              type="button"
              class="track-close-btn"
              aria-label="Cancel tracking"
              (click)="toggleTrackInput()">
              ✕
            </button>
          </div>

        </div>

        <!-- Search icon (hidden while search is open) -->
        <button
          *ngIf="!searchOpen"
          type="button"
          class="search-btn"
          (click)="openSearch()"
          aria-label="Open search"
          [attr.aria-expanded]="searchOpen">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
            <circle cx="11" cy="11" r="6" stroke="currentColor" stroke-width="2"></circle>
          </svg>
        </button>

        <!-- Cart -->
        <button class="icon-btn cart-btn" type="button"
                aria-label="Cart" (click)="openCartDrawer()">
          <svg viewBox="0 0 24 24" fill="none"
               xmlns="http://www.w3.org/2000/svg" [attr.aria-hidden]="true">
            <path d="M6 6h15l-1.5 9h-12L4 2H2"
                  stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="10" cy="20" r="1" fill="currentColor"/>
            <circle cx="18" cy="20" r="1" fill="currentColor"/>
          </svg>
          <span class="badge"
                *ngIf="(cartCount$ | async) as c"
                [class.hidden]="c === 0">
            {{ c }}
          </span>
        </button>

        <!-- Desktop User Menu -->
        <ng-container *ngIf="isLoggedIn()">
          <app-user-menu
            class="desktop-user-menu"
            [user]="user()"
            (orders)="onMyOrders()"
            (profile)="onProfile()"
            (openCartRequested)="openCartDrawer()"
            (logout)="onLogout()">
          </app-user-menu>
        </ng-container>

        <!-- Mobile Login -->
        <ng-container *ngIf="!isLoggedIn()">
          <button
            type="button"
            class="icon-btn sign-in-btn mobile-auth-btn"
            aria-label="Sign in"
            title="Sign in"
            (click)="router.navigate(['/login'])">

            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true">
              <circle
                cx="12"
                cy="8"
                r="4"
                stroke="currentColor"
                stroke-width="2"/>
              <path
                d="M4 21c.8-4 3.5-6 8-6s7.2 2 8 6"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"/>
            </svg>
          </button>
        </ng-container>

        <!-- Logged-in account actions (My Orders / Profile / Cart / Logout)
             now live only in the mobile side menu (see <app-navbar>), opened
             via .mobile-menu-btn above — the avatar dropdown is retired. -->

        <!-- Theme picker, dark-mode toggle, mobile logout and the old sign-in
             link were commented out here — unchanged, removed from this copy
             for brevity. Restore from your original file if you re-enable them. -->

      </div>
      <!-- /.actions -->
    </div>

  </div><!-- /.pc-header__topbar -->

</header>

<!-- Spacer to prevent content being hidden when header is sticky on mobile -->
<!-- <div class="header-spacer" aria-hidden="true"></div> -->


<!-- Cart / Checkout Drawer — logic unchanged -->
<app-drawer
  [isPublic]="true"
  [title]="drawerTitle"
  [state]="drawerState"
  (stateChange)="onDrawerChange($event)"
  [showBack]="isCheckout && !isOrderPlaced"
  (back)="onDrawerBack()">

  <div class="cart-in-drawer">
    <ng-container *ngIf="drawerContent === 'cart'">
      <app-cart [inDrawer]="true" (openCheckout)="openCheckoutInDrawer()"></app-cart>
    </ng-container>
    <ng-container *ngIf="drawerContent === 'checkout'">
      <ng-container *ngIf="checkoutComponent; else loadingCheckout">
        <ng-container *ngComponentOutlet="checkoutComponent"></ng-container>
      </ng-container>
      <ng-template #loadingCheckout>
        <div class="loading-checkout-placeholder">Loading checkout…</div>
      </ng-template>
    </ng-container>
  </div>

</app-drawer>
