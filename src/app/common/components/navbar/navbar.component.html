<nav class="navbar shadow-sm">
  <div class="container-fluid">

    <!-- ── All Categories trigger (Desktop only) ──────────────────────────── -->
    <div
      class="all-categories-wrap d-none d-md-flex"
      (mouseenter)="openMegaMenu()"
      (mouseleave)="closeMegaMenu()"
    >
      <button
        class="all-categories-toggle"
        aria-haspopup="true"
        [attr.aria-expanded]="isMegaMenuOpen"
        (click)="$event.stopPropagation(); isMegaMenuOpen = !isMegaMenuOpen"
      >
        ☰ &nbsp;All Categories
      </button>

      <!-- "All Categories" dedicated link — moved into the mega-menu right column -->

      <!-- ── Master–Detail Mega Menu ──────────────────────────────────────── -->
      <div class="mega-menu" [class.show]="isMegaMenuOpen">

        <!-- LEFT column: vertical parent category list + View All at bottom -->
        <ul class="mega-left">
          <!-- View All — pinned at the bottom of the left column -->
          <li class="mega-left__view-all-item">
            <a class="mega-left__view-all" (click)="navigateAll(); closeMegaMenu()">
              View All
            </a>
          </li>
          <li
            *ngFor="let cat of categories; trackBy: trackById"
            class="mega-left__item"
            [class.is-active]="cat.id === activeCategoryId"
            (mouseenter)="setActiveCategory(cat)"
            (click)="navigateCategory(cat)"
          >
            <span class="mega-left__label">{{ cat.category }}</span>
            <!-- Chevron only for categories that have children -->
            <span class="mega-left__arrow" *ngIf="cat.children?.length">›</span>
          </li>

          
        </ul>

        <!-- RIGHT column: children of the hovered/active parent.
             Hidden entirely when the active category has no children. -->
        <div class="mega-right" [class.mega-right--hidden]="!activeCategory?.children?.length">
          <ng-container *ngIf="activeCategory?.children?.length">
            <p class="mega-right__heading">{{ activeCategory!.category }}</p>

            <ul class="mega-right__list">
              <li
                *ngFor="let child of activeCategory!.children; trackBy: trackById"
                class="mega-right__item"
              >
                <a
                  class="mega-right__link"
                  (click)="navigateChild(child); closeMegaMenu()"
                >
                  {{ child.category }}
                </a>
              </li>
            </ul>
          </ng-container>
        </div>

      </div><!-- /mega-menu -->
    </div><!-- /all-categories-wrap -->

    <!-- ── Static nav links (desktop-only) ──────────────────────────────── -->
    <a class="navbar-brand desktop-only" [routerLink]="['/']" (click)="onHomeClick()">Home</a>
    
    <a class="navbar-brand desktop-only" [routerLink]="['/']" (click)="onDealsClick()">Deals</a>
    <a class="navbar-brand desktop-only" [routerLink]="['/']" (click)="onNewArrivalsClick()">New Arrivals</a>

    <!-- ── Desktop: search — centred between left nav items and right spacer ── -->
    <!-- <div class="d-none d-md-flex align-items-center desktop-search-wrapper">
      <app-product-suggest
        class="desktop-search"
        [mode]="searchMode">
      </app-product-suggest>
    </div> -->

    <!-- Right-side flex spacer (desktop only) — mirrors the left nav width so the
         search wrapper lands at true centre of the navbar.
         Hidden on mobile; mobile layout is unaffected. -->
    <div class="desktop-nav-spacer d-none d-md-flex" aria-hidden="true"></div>

    <!-- ── Mobile: search bar ───────────────────────────────────────────────
         Hamburger trigger now lives in <app-header> (top-left of the header
         bar) instead of here — see MobileMenuService for the shared state.
         Visibility is driven by showMobileSearch$: on every page except
         Product it's always true (unchanged behavior). On the Product page
         (mobile only), it can be collapsed behind a new icon that lives in
         product.component.html — see MobileSearchToggleService. -->
    <!-- <div
      class="d-flex d-md-none w-100 align-items-center"
      #mobileSearchWrapper
      *ngIf="showMobileSearch$ | async">
      <div class="d-flex align-items-center flex-grow-1 mobile-search-wrapper">
        <app-product-suggest
  class="w-100"
  [mode]="searchMode">
</app-product-suggest>
    </div>
    </div> -->

  </div>
</nav>

<!-- ════════════════════════════════════════════════════════════════════════
     Mobile Offcanvas Sidebar
     ════════════════════════════════════════════════════════════════════════ -->
<div
  class="offcanvas"
  [class.show]="isSidebarOpen"
  id="mobileSidebar"
  [style.visibility]="isSidebarOpen ? 'visible' : 'hidden'"
  role="dialog"
  aria-modal="true"
  aria-labelledby="mobileSidebarLabel"
>
  <div class="offcanvas-header">
    <span class="offcanvas-title" id="mobileSidebarLabel">Menu</span>
    <button class="offcanvas-close" (click)="closeSidebar()" aria-label="Close">&#x2715;</button>
  </div>

  <div class="offcanvas-body">

    <!-- Static links -->
    <ul class="mobile-static-links">
      <li><a [routerLink]="['/']" (click)="onMobileMenuItemClick()">HOME</a></li>
    </ul>

<ul class="mobile-static-links">
  <li><a [routerLink]="['/']" (click)="onDealsClick()">DEALS</a></li>
</ul>

<ul class="mobile-static-links">
   <li><a [routerLink]="['/']" (click)="onNewArrivalsClick()">NEW ARRIVALS</a></li>
</ul>

    <hr class="mobile-divider" />

      <ul class="mobile-static-links">
        <li>
          <a (click)="navigateAll(); onMobileMenuItemClick()">VIEW ALL</a>
        </li>
      </ul>

    <!-- Category accordion -->
    <ul class="mobile-cat-list" *ngIf="categories?.length">
      <li
        *ngFor="let cat of categories; trackBy: trackById"
        class="mobile-cat-item"
      >
        <!-- Parent row — expands/collapses children on tap -->
        <div
          class="mobile-cat-row"
          [class.is-open]="isMobileOpen(cat.id)"
          (click)="onMobileCategoryRowClick(cat, $event)"
        >
          <span class="mobile-cat-label">{{ cat.category }}</span>
          <span class="mobile-cat-chevron" *ngIf="cat.children?.length">
            {{ isMobileOpen(cat.id) ? '−' : '+' }}
          </span>
        </div>

        <!-- Children — each carries full parent context on click -->
        <ul
          class="mobile-sub-list"
          *ngIf="cat.children?.length && isMobileOpen(cat.id)"
        >
          <li
            *ngFor="let child of cat.children; trackBy: trackById"
            class="mobile-sub-item"
          >
            <!--
              Same navigateChild() call as desktop — builds:
                { id, category, parentCategory: { id, category, parentCategory: null } }
            -->
            <a
              class="mobile-sub-link"
              (click)="navigateChild(child); onMobileMenuItemClick()"
            >
              {{ child.category }}
            </a>
          </li>
        </ul>
      </li>
    </ul>

    <!-- Mobile Track Order -->
<div class="mobile-track-menu-item">

  <button
    type="button"
    class="mobile-menu-track-btn"
    (click)="toggleMobileTrackOrder()">

    <span class="mobile-menu-track-left">

      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="21"
        height="21"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round">

        <circle cx="5" cy="17" r="3"/>
        <circle cx="19" cy="17" r="3"/>
        <path d="M12 17H5.5"/>
        <path d="M19 17h-2l-3-6h-4l-1 3"/>
        <path d="M14 11l2-4h3"/>
      </svg>

      <span>Track Order</span>

    </span>

    <span class="track-chevron">
      {{ mobileTrackOpen ? '−' : '+' }}
    </span>

  </button>


  <!-- Track input -->
  <div
    *ngIf="mobileTrackOpen"
    class="mobile-track-input-wrap">

    <input
      type="text"
      [(ngModel)]="mobileTrackRefNo"
      placeholder="Enter Order / Ref No"
      class="mobile-track-input"
      (keyup.enter)="trackOrderMobile()" />

    <button
      type="button"
      class="mobile-track-search-btn"
      (click)="trackOrderMobile()">

      Search
    </button>

  </div>

  

</div>

<div class="mobile-menu-panel__footer">
  <ng-container *ngIf="isLoggedIn(); else guestFooter">
    <button type="button" class="menu-item" (click)="onMyOrders()">
      <svg class="menu-item-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M9 3h6l1 3h4a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h4l1-3Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M9 12h6M9 16h6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      My Orders
    </button>

    <button type="button" class="menu-item" (click)="onProfile()">
      <svg class="menu-item-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2"/>
        <path d="M4 21c0-3.87 3.58-7 8-7s8 3.13 8 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Profile
    </button>

    <button type="button" class="menu-item" (click)="onAccountCart()">
      <svg class="menu-item-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="9" cy="20" r="1.5" fill="currentColor"/>
        <circle cx="18" cy="20" r="1.5" fill="currentColor"/>
        <path d="M2 3h2l2.4 12.4a2 2 0 0 0 2 1.6h8.6a2 2 0 0 0 2-1.6L21 7H6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Cart
    </button>

    <button type="button" class="menu-item danger" (click)="onLogout()">
      <svg class="menu-item-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M16 17l5-5-5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M21 12H9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Logout
    </button>
  </ng-container>

  <ng-template #guestFooter>
    <button type="button" class="menu-item" (click)="onLoginClick()">
      <svg class="menu-item-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M10 17l5-5-5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M15 12H3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Login
    </button>

    <button type="button" class="menu-item" (click)="onSignupClick()">
      <svg class="menu-item-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="9" cy="7" r="4" stroke="currentColor" stroke-width="2"/>
        <path d="M19 8v6M22 11h-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Sign Up
    </button>
  </ng-template>
</div>

  </div>
</div>

<!-- Backdrop -->
<div
  class="offcanvas-backdrop"
  [class.show]="isSidebarOpen"
  (click)="closeSidebar()"
  *ngIf="isSidebarOpen"
></div>
