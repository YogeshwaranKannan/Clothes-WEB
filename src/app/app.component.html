     *ngIf removes them from the DOM entirely on other routes (not just
     visually hidden), so no extra HTTP calls or animations run on
     product-list / category / product-detail pages. -->
<ng-container *ngIf="isHomePage">
  <app-hero-banner></app-hero-banner>
</ng-container>
